[config]
schemaVersion = "0.0.1"

[package]
namespace = "kdpen"
name = "Beelzebub"
versionNumber = "0.137.7"
description = "ALPHA (pre-1.0, test servers only). Devour the bestiary: every kill can teach you an enemy's abilities, and some bosses let you take their form. Slot captures, bind extra hotkeys, complete your collection. Server-side, admin-configurable."
websiteUrl = "https://github.com/KDavidP1987/Beelzebub-Lord-of-Gluttony"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_V_Rising = "1.733.2"
deca-VampireCommandFramework = "0.10.4"

[build]
icon = "icon.png"
readme = "README.md"
outdir = "build"

[[build.copy]]
source = "dist/BepInEx"
target = "BepInEx"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = ["v-rising"]

[publish.categories]
v-rising = ["mods", "server-side"]
